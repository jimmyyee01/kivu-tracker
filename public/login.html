<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — KIVU Tracker</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand row" style="margin-bottom:14px">
      <span class="logo"></span>
      <h1 id="title" style="margin:0">KIVU Tracker</h1>
    </div>
    <p class="muted small" id="subtitle">GPS tracking &amp; fleet management console</p>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">Username or e-mail</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary" id="submitBtn" type="submit" style="width:100%;justify-content:center">Sign in</button>
      <p class="hint" id="error" style="color:#ff9c93;margin-top:10px"></p>
      <p class="hint" style="margin-top:12px">New fleet?
        <a href="/register">Start a 5-day free trial</a> — no card needed.</p>
    </form>

    <details style="margin-top:18px">
      <summary class="muted small" style="cursor:pointer">Demo accounts (created by install.php)</summary>
      <div class="demo-logins" id="demoLogins"></div>
    </details>

    <p class="hint" style="margin-top:16px">
      Devices connect to the Wialon IPS server on TCP port <b id="ipsPort">20332</b> —
      start it with <code>php php/tracker.php</code>.
    </p>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
