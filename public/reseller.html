<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reseller portal — KIVU Tracker</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="topbar"></div>

<div style="max-width:1100px;margin:0 auto;padding:14px">
  <div class="card pad" id="portalCard" style="margin-bottom:14px">
    <div class="row wrap">
      <h2 style="margin:0" id="portalTitle">Loading…</h2>
      <span class="chip info" id="portalChip">—</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn sm" id="btnReload">Refresh</button>
    </div>
    <p class="muted small" id="portalNote" style="margin-top:8px"></p>
    <div class="stats" id="portalStats" style="margin-top:10px"></div>
  </div>

  <div class="row wrap" style="margin-bottom:10px">
    <button class="btn primary sm" id="btnNewAccount">+ New client account</button>
    <span class="chip info right" id="accountChip">—</span>
  </div>
  <div id="accountsTable"></div>
  <p class="hint" style="margin-top:12px">Your portal is licensed for a full year. The platform
    administrator renews it — client accounts keep their data; ask them before the year ends.</p>
</div>

<script src="/js/common.js"></script>
<script src="/js/reseller.js"></script>
</body>
</html>
